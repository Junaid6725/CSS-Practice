<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="gallery-title">Polaroid Image Gallery</h1>
    <section class="polaroid-gallery">
      <h2 class="section-name">Birds</h2>
      <figure class="polaroid-card">
        <img src="./img/swan.jpg" alt="Swan" class="card-img" />
        <figcaption class="card-text">Swan</figcaption>
      </figure>
      <figure class="polaroid-card">
        <img src="./img/falcon.jpg" alt="Falcon" class="card-img" />
        <figcaption class="card-text">Falcon</figcaption>
      </figure>
      <figure class="polaroid-card">
        <img src="./img/owl.jpg" alt="Owl" class="card-img" />
        <figcaption class="card-text">Owl</figcaption>
      </figure>
      <figure class="polaroid-card">
        <img src="./img/parrot.jpg" alt="Parrot" class="card-img" />
        <figcaption class="card-text">Parrot</figcaption>
      </figure>
    </section>
    <section class="polaroid-gallery">
      <h2 class="section-name">Animals</h2>
      <figure class="polaroid-card">
        <img src="./img/horse.jpg" alt="Horse" class="card-img" />
        <figcaption class="card-text">Horse</figcaption>
      </figure>
      <figure class="polaroid-card">
        <img src="./img/rabbit.jpg" alt="Rabbit" class="card-img" />
        <figcaption class="card-text">Rabbit</figcaption>
      </figure>
      <figure class="polaroid-card">
        <img src="./img/deer.jpg" alt="Deer" class="card-img" />
        <figcaption class="card-text">Deer</figcaption>
      </figure>
      <figure class="polaroid-card">
        <img src="./img/bear.jpg" alt="Bear" class="card-img" />
        <figcaption class="card-text">Bear</figcaption>
      </figure>
    </section>
  </body>
</html>
